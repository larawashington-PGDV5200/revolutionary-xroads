<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revolution Migration</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel">
      <h1>Revolution Migration</h1>
      <div class="buttons">
        <button id="explode">Explode</button>
        <button id="reset" title="Reset view (R)">Reset view</button>
      </div>
      <fieldset>
        <legend>Layers</legend>
        <div id="toggles"></div>
      </fieldset>
    </aside>

    <footer id="timeline">
      <div class="track">
        <div id="strip"></div>
        <div id="acts"></div>
        <input id="year" type="range" aria-label="Decade" />
        <div id="ticks"></div>
      </div>
      <div class="side">
        <span id="year-label"></span>
        <p id="strip-note"></p>
      </div>
    </footer>

    <p id="hint" hidden></p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
